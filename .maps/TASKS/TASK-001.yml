task_id: TASK-001
title: Establish application foundation and record implementation choices
status: READY_FOR_AUDIT
goal: Select and initialize the modular-monolith foundation the maps intentionally leave open.
user_behavior: Builders can start the application locally with documented public, protected, application, and persistence boundaries.
context:
  project_map: "Sections 9-10 require a maintainable portfolio but prescribe no framework, database, hosting, or authentication provider."
  architecture_map: "Sections 1.2 and 2 require one deployable modular monolith with separated public, admin, application, and persistence responsibilities."
scope:
  files_or_components:
    - Application bootstrap, tooling, and route/module layout
    - Environment configuration template and secret-handling conventions
    - Decision records for framework, persistence, deployment assumption, and configuration approach
dependencies: []
acceptance_criteria:
  - Documented commands install, start, and build the application locally.
  - Selected technologies are recorded with rationale and affected components.
  - The layout distinguishes public presentation, protected administration, application logic, and persistence without separate services.
  - No secrets are committed.
verification:
  required:
    - Run documented install, development-start, and production-build checks.
    - Inspect ignored/example environment configuration for real credentials.
assigned_to:
  role: fullstack
  agent: Builder A
notes:
  - Record technical choices; do not represent them as product requirements.
  - Completed by Builder A on maps/builder-a (commit 316d731, handoff TASK-001-builder-a.md). Builder B independently re-verified install/typecheck/lint/build after merge into maps/builder-b.
